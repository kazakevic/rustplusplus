version: '3.3'
services:
    app:
        volumes:
            - ./credentials:/app/credentials
            - ./instances:/app/instances
            - ./logs:/app/logs
            - ./maps:/app/maps
        environment:
            # Set these in the deployment environment (Dokploy project environment
            # variables, or a .env file next to this compose file). The :? makes a
            # missing value fail the deploy instead of silently starting the bot
            # with an invalid token.
            - RPP_DISCORD_CLIENT_ID=${RPP_DISCORD_CLIENT_ID:?RPP_DISCORD_CLIENT_ID is not set}
            - RPP_DISCORD_TOKEN=${RPP_DISCORD_TOKEN:?RPP_DISCORD_TOKEN is not set}
            - RPP_BATTLEMETRICS_TOKEN=${RPP_BATTLEMETRICS_TOKEN:-}
        container_name: rpp
        build:
            context: .
            dockerfile: Dockerfile
        image: rustplusplus:local
